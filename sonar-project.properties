# SonarCloud Project Configuration

# Organization (SonarCloud'daki organizasyon adın)
sonar.organization=YOUR_ORGANIZATION_KEY

# Unique project key (SonarCloud'da oluşturduğun proje key)
sonar.projectKey=YOUR_PROJECT_KEY

# Project name and version
sonar.projectName=Fast Test Case With RL
sonar.projectVersion=1.0

# Source code encoding
sonar.sourceEncoding=UTF-8

# Source directories
sonar.sources=.

# Exclusions (test files, virtual env, cache, etc.)
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/venv/**,**/.git/**,**/htmlcov/**,**/*.pyc,**/temp/**,**/tests/**

# Test directories
sonar.tests=tests
sonar.test.inclusions=**/tests/**

# Python coverage report path (generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Python version
sonar.python.version=3.13

